<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            font-size: 16px;
            cursor: pointer;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
        }
        button:hover {
            background: #45a049;
        }
        #output {
            background: #2a2a2a;
            padding: 20px;
            margin-top: 20px;
            border-radius: 4px;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }
        .success { color: #4CAF50; }
        .error { color: #f44336; }
        .info { color: #2196F3; }
    </style>
</head>
<body>
    <h1>🧪 Code Muse Board - API Test</h1>
    
    <div>
        <button onclick="testAll()">Test: Get All News</button>
        <button onclick="testFrontend()">Test: Frontend Category</button>
        <button onclick="testTrending()">Test: Trending Category</button>
        <button onclick="testGeneral()">Test: General Category</button>
        <button onclick="clearOutput()">Clear Output</button>
    </div>
    
    <div id="output">Click a button to test the API...</div>

    <script>
        const API_BASE = 'http://localhost:3001/api/news';
        const output = document.getElementById('output');

        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const span = document.createElement('span');
            span.className = type;
            span.textContent = `[${timestamp}] ${message}\n`;
            output.appendChild(span);
            output.scrollTop = output.scrollHeight;
        }

        function clearOutput() {
            output.innerHTML = 'Output cleared...\n';
        }

        async function testAPI(url, description) {
            log(`\n${'='.repeat(60)}`, 'info');
            log(`Testing: ${description}`, 'info');
            log(`URL: ${url}`, 'info');
            log('Fetching...', 'info');

            try {
                const startTime = Date.now();
                const response = await fetch(url);
                const endTime = Date.now();

                log(`✓ Response Status: ${response.status} ${response.statusText}`, 'success');
                log(`✓ Response Time: ${endTime - startTime}ms`, 'success');

                if (response.ok) {
                    const data = await response.json();
                    log(`✓ Response received successfully`, 'success');
                    log(`  - Status: ${data.status}`, 'info');
                    log(`  - Results: ${data.results} articles`, 'info');
                    log(`  - Total Pages: ${data.totalPages}`, 'info');
                    log(`  - Current Page: ${data.currentPage}`, 'info');
                    log(`  - Filters: ${JSON.stringify(data.filters)}`, 'info');
                    log(`  - Data Array Length: ${data.data?.length || 0}`, 'info');

                    if (data.data && data.data.length > 0) {
                        log(`\n📰 First 3 Articles:`, 'info');
                        data.data.slice(0, 3).forEach((article, i) => {
                            log(`  ${i + 1}. ${article.title.substring(0, 60)}...`, 'info');
                            log(`     Category: "${article.category}"`, 'info');
                            log(`     Date: ${article.timestamp || 'N/A'}`, 'info');
                        });
                    } else {
                        log(`⚠️ No articles in response!`, 'error');
                    }

                    log(`\n✅ TEST PASSED`, 'success');
                } else {
                    const errorText = await response.text();
                    log(`✗ Request failed: ${errorText}`, 'error');
                    log(`❌ TEST FAILED`, 'error');
                }
            } catch (error) {
                log(`✗ Error: ${error.message}`, 'error');
                log(`❌ TEST FAILED`, 'error');
            }
        }

        async function testAll() {
            await testAPI(API_BASE, 'Get All News (No Filters)');
        }

        async function testFrontend() {
            await testAPI(`${API_BASE}?category=Frontend`, 'Frontend Category Filter');
        }

        async function testTrending() {
            await testAPI(`${API_BASE}?category=Trending`, 'Trending Category Filter');
        }

        async function testGeneral() {
            await testAPI(`${API_BASE}?category=General`, 'General Category Filter');
        }

        // Auto-run test on page load
        window.addEventListener('load', () => {
            log('🚀 API Tester Ready!', 'success');
            log('Server: ' + API_BASE, 'info');
            log('Click a button to test the API endpoints\n', 'info');
        });
    </script>
</body>
</html>
